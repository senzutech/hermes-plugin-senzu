name: Bug report
description: Something does not work as described in the README
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `hermes senzu doctor`
      render: text
  - type: input
    id: versions
    attributes:
      label: Hermes Agent and plugin versions
      placeholder: "hermes --version, and the plugin version from plugin.yaml"
  - type: markdown
    attributes:
      value: "Never paste API keys, bot tokens or conversation content. Security issues go to SECURITY.md."

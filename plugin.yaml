name: senzu
version: "0.4.0"
description: >-
  Senzu, the technicians who maintain this assistant, one request away: the senzu skill and MCP
  server to hand a problem over, a warning before critical actions, news of each handover, and
  maintenance access while the paid work is in progress.
author: Senzu
homepage: https://github.com/senzutech/hermes-plugin-senzu
provides_hooks:
  - pre_tool_call
  - post_tool_call
requires_env:
  - name: SENZU_API_KEY
    description: "Clé d'installation fournie par Senzu"
    url: "https://github.com/senzutech/hermes-plugin-senzu#installation"
    secret: true
